services:
  - type: web
    name: kahvecell-api-reset-34
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: KAHVECELL_JWT_SECRET
        generateValue: true
      - key: KAHVECELL_QR_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://kahvecell-web-reset-34.onrender.com

  - type: web
    name: kahvecell-web-reset-34
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kahvecell-api-reset-34.onrender.com/api/v1
